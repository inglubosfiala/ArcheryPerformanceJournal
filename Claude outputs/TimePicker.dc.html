<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time picker – bottom sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
body{margin:0;background:#0b0e10}
a{color:#4fd1a1}a:hover{color:#7fe3be}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0b0e10; font-family: Inter, system-ui, sans-serif; color: #eef1f3">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
    <dc-import name="NsShooting" hint-size="390px,844px"></dc-import>
  </div>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(5,7,8,0.66)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="tp-title" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; border-radius: 24px 24px 0 0; background: #161b1f; border-top: 1px solid #2a3238; padding: 10px 16px 28px 16px; display: flex; flex-direction: column; gap: 16px">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3a444b"></span>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 id="tp-title" style="margin: 0; font-size: 20px; font-weight: 700">Start time</h2>
      <span style="font-size: 13px; color: #a3adb5">Today · Mon 16 Nov</span>
    </div>

    <div role="group" aria-label="Quick times" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ quick }}" as="q" hint-placeholder-count="4">
        <button onClick="{{ q.pick }}" aria-pressed="{{ q.pressed }}" style="height: 44px; border-radius: 22px; border: 1px solid {{ q.border }}; background: {{ q.bg }}; color: {{ q.fg }}; font-size: 14px; font-weight: 600">{{ q.label }}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; padding: 4px 8px; border-radius: 20px; background: #0f1316; border: 1px solid #222a30">
      <div role="group" aria-label="Hour" style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <button onClick="{{ hUp }}" aria-label="Hour later" style="width: 100%; height: 52px; border: none; background: transparent; color: #c9d0d5; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
        </button>
        <output aria-live="polite" style="font-size: 72px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em">{{ hh }}</output>
        <span style="font-size: 12px; color: #a3adb5">hour</span>
        <button onClick="{{ hDown }}" aria-label="Hour earlier" style="width: 100%; height: 52px; border: none; background: transparent; color: #c9d0d5; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>
      <span style="font-size: 56px; font-weight: 800; color: #5a646b; text-align: center; margin-top: -24px">:</span>
      <div role="group" aria-label="Minute" style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <button onClick="{{ mUp }}" aria-label="Minute later" style="width: 100%; height: 52px; border: none; background: transparent; color: #c9d0d5; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
        </button>
        <output aria-live="polite" style="font-size: 72px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em">{{ mm }}</output>
        <span style="font-size: 12px; color: #a3adb5">minute · hold to scroll</span>
        <button onClick="{{ mDown }}" aria-label="Minute earlier" style="width: 100%; height: 52px; border: none; background: transparent; color: #c9d0d5; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>
    </div>

    <div role="group" aria-label="Round minutes" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ rounds }}" as="r" hint-placeholder-count="4">
        <button onClick="{{ r.pick }}" style="height: 40px; border-radius: 12px; border: 1px solid #2a3238; background: #0f1316; color: #eef1f3; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums">{{ r.label }}</button>
      </sc-for>
    </div>

    <p style="margin: 0; font-size: 13px; line-height: 19px; color: {{ hintColor }}; text-align: center">{{ hint }}</p>

    <div style="display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px">
      <button style="height: 56px; border-radius: 16px; border: 1px solid #2a3238; background: #161b1f; color: #eef1f3; font-size: 16px; font-weight: 700">Cancel</button>
      <button style="height: 56px; border-radius: 16px; border: none; background: #0b7a55; color: #ffffff; font-size: 16px; font-weight: 700">Set {{ hh }}:{{ mm }}</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.now = 15 * 60 + 51;
    this.state = { t: this.now };
  }
  renderVals() {
    const st = this.state, now = this.now;
    const norm = (v) => ((v % 1440) + 1440) % 1440;
    const set = (v) => this.setState({ t: norm(v) });
    const h = Math.floor(st.t / 60), m = st.t % 60;
    const pad = (n) => String(n).padStart(2, '0');
    const diff = now - st.t;
    const quick = [['Now', 0], ['−15 min', 15], ['−30 min', 30], ['−1 h', 60]].map(([label, off]) => {
      const on = diff === off;
      return { label, pressed: on ? 'true' : 'false', bg: on ? '#0b7a55' : '#0f1316', fg: on ? '#ffffff' : '#eef1f3', border: on ? '#0b7a55' : '#2a3238', pick: () => set(now - off) };
    });
    const hint = diff === 0 ? 'Starts now — the session timer starts at 0:00.'
      : diff > 0 ? 'Started ' + (diff >= 60 ? Math.floor(diff / 60) + ' h ' : '') + (diff % 60 ? (diff % 60) + ' min ' : '') + 'ago — the timer starts at ' + Math.floor(diff / 60) + ':' + pad(diff % 60) + '.'
      : 'That is later than now — pick a time up to now.';
    return {
      hh: pad(h), mm: pad(m), quick,
      hUp: () => set(st.t + 60), hDown: () => set(st.t - 60),
      mUp: () => set(st.t + 1), mDown: () => set(st.t - 1),
      rounds: [0, 15, 30, 45].map((x) => ({ label: ':' + pad(x), pick: () => set(h * 60 + x) })),
      hint, hintColor: diff < 0 ? '#f2b84b' : '#a3adb5'
    };
  }
}
</script>
</body>
</html>
